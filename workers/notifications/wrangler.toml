name = "descowise-notifications"
main = "src/index.ts"
compatibility_date = "2026-07-24"
# @block65/webcrypto-web-push uses Worker Web Crypto first and retains a Node
# fallback for local runtimes; this flag makes that fallback resolvable too.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "descowise-notifications"
database_id = "1785e6ea-b72d-4233-87cb-dd6237405414"
migrations_dir = "migrations"

[vars]
# Comma-separated frontend origins, without trailing slashes. Add the local Vite
# origin when testing against the deployed Worker.
ALLOWED_ORIGIN = "https://descowise.pages.dev,http://localhost:5173"
VAPID_PUBLIC_KEY = "BNN76KIY1Sa8cc3fHyrK5sXZbC4Y6Dc47hPt_cIlzyT-wCBc5IEMZRIcrY8-l_W5fEE9beSPpxypMC_KnhXmxRc"
VAPID_SUBJECT = "mailto:operations@example.com"

[triggers]
# 00:00 UTC = 06:00 Asia/Dhaka.
crons = ["0 0 * * *"]

[[queues.producers]]
binding = "BALANCE_CHECKS"
queue = "descowise-balance-checks"

[[queues.consumers]]
queue = "descowise-balance-checks"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
